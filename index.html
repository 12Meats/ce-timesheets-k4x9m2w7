<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>CE Timesheets</title>
  <meta name="theme-color" content="#1d4ed8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="CE Timesheets">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <style>
    :root {
      --color-accent: #1d4ed8;
      --color-accent-dark: #1e3a8a;
      --color-confirm: #15803d;
      --color-danger: #b91c1c;
      --color-bg: #f8fafc;
      --color-surface: #ffffff;
      --color-text: #0f172a;
      --color-text-muted: #475569;
      --color-border: #cbd5e1;
      --color-warn-bg: #fef3c7;
      --color-warn-border: #f59e0b;
      --color-warn-text: #92400e;
      --color-chart-guide: #94a3b8;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --space-1: 8px;
      --space-2: 12px;
      --space-3: 16px;
      --space-4: 24px;
      --space-5: 32px;
      --font-body: 1.1rem;
      --font-lg: 1.4rem;
      --font-xl: 2rem;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--color-bg);
      color: var(--color-text);
      font-family: var(--font);
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior-y: contain;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
    }

    h1, h2, h3, p { margin: 0; }

    button {
      font-family: inherit;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    /* ---------- Top bar ---------- */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: var(--space-1);
      min-height: 56px;
      padding: var(--space-1) var(--space-2);
      padding-top: calc(var(--space-1) + env(safe-area-inset-top));
      background: var(--color-accent);
      color: #ffffff;
    }
    .topbar[hidden] { display: none; }

    .back-btn {
      appearance: none;
      border: none;
      background: transparent;
      color: #ffffff;
      font-size: 1.1rem;
      font-weight: 600;
      min-width: 48px;
      min-height: 48px;
      padding: 0 10px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }
    .back-btn:active { background: rgba(255, 255, 255, 0.18); }
    .back-btn[hidden] { display: none; }

    .topbar-title {
      flex: 1;
      font-size: 1.25rem;
      font-weight: 700;
      text-align: center;
      padding-right: 48px; /* balance the back button so title stays visually centered */
    }

    /* ---------- Screens ---------- */
    .screen[hidden] { display: none; }

    /* Shared by every real screen (Tasks 5-8): scrollable content area whose
       bottom padding respects the home-indicator safe area. */
    .screen-content {
      padding: var(--space-4) 20px;
      padding-bottom: calc(var(--space-4) + env(safe-area-inset-bottom));
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .screen-placeholder {
      font-size: var(--font-body);
      color: var(--color-text-muted);
    }

    /* ---------- PIN screen ---------- */
    .pin-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      padding: var(--space-5) var(--space-4);
      padding-top: calc(var(--space-5) + env(safe-area-inset-top));
      padding-bottom: calc(var(--space-5) + env(safe-area-inset-bottom));
      gap: 28px;
      text-align: center;
    }

    .app-name {
      font-size: var(--font-xl);
      font-weight: 800;
      color: var(--color-accent);
      letter-spacing: -0.02em;
    }

    .pin-message {
      font-size: 1.15rem;
      font-weight: 600;
      color: var(--color-text-muted);
      min-height: 1.5em;
    }

    .pin-dots {
      display: flex;
      gap: 18px;
    }

    .dot {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 3px solid var(--color-accent);
      background: transparent;
      transition: background-color 0.15s ease;
    }
    .dot.filled { background: var(--color-accent); }

    @keyframes shake {
      10%, 90% { transform: translateX(-4px); }
      20%, 80% { transform: translateX(8px); }
      30%, 50%, 70% { transform: translateX(-14px); }
      40%, 60% { transform: translateX(14px); }
    }
    .pin-dots.shake { animation: shake 0.5s; }
    .pin-dots.shake .dot { border-color: var(--color-danger); }

    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      width: 100%;
      max-width: 340px;
    }

    .key {
      min-height: 68px;
      font-size: 1.6rem;
      font-weight: 600;
      border-radius: 14px;
      border: 1px solid var(--color-border);
      background: var(--color-surface);
      color: var(--color-text);
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.06);
    }
    .key:active { background: #e2e8f0; }

    .key-blank {
      visibility: hidden;
      pointer-events: none;
      border: none;
      box-shadow: none;
      background: transparent;
    }

    .key-back {
      color: var(--color-danger);
      font-size: 1.4rem;
    }

    /* ---------- Shared building blocks for later screens ---------- */
    .btn {
      min-height: 48px;
      font-size: 1.05rem;
      font-weight: 600;
      border-radius: 12px;
      border: 1px solid var(--color-border);
      background: var(--color-surface);
      color: var(--color-text);
      padding: var(--space-2) 18px;
    }
    .btn-primary { background: var(--color-accent); border-color: var(--color-accent); color: #fff; }
    .btn-confirm { background: var(--color-confirm); border-color: var(--color-confirm); color: #fff; }
    .btn-danger { background: var(--color-danger); border-color: var(--color-danger); color: #fff; }

    .btn-block { display: block; width: 100%; text-align: center; }

    input[type="text"] {
      min-height: 48px;
      font-size: var(--font-body);
      font-family: inherit;
      border-radius: 10px;
      border: 1px solid var(--color-border);
      background: var(--color-surface);
      color: var(--color-text);
      padding: 0 var(--space-2);
      width: 100%;
    }
    input[type="text"]:focus { outline: 2px solid var(--color-accent); outline-offset: 1px; }
    input.field-invalid { border-color: var(--color-danger); outline-color: var(--color-danger); }

    /* ---------- Cards (worker list) ---------- */
    .worker-card {
      display: block;
      width: 100%;
      text-align: left;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: 12px;
      padding: var(--space-3);
      margin-bottom: var(--space-2);
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.06);
    }
    .worker-card:active { background: #eef2f7; }
    .worker-card-name { font-size: var(--font-lg); font-weight: 700; color: var(--color-text); }
    .worker-card-hours { margin-top: 4px; font-size: var(--font-body); color: var(--color-text-muted); }

    .empty-state {
      font-size: var(--font-body);
      color: var(--color-text-muted);
      padding: var(--space-4) 0;
      text-align: center;
    }

    .section-heading {
      font-size: var(--font-lg);
      font-weight: 700;
      margin: var(--space-4) 0 var(--space-2);
    }
    .section-heading:first-child { margin-top: 0; }

    .add-worker-form {
      display: flex;
      flex-direction: column;
      gap: var(--space-2);
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: 12px;
      padding: var(--space-3);
      margin-bottom: var(--space-3);
    }
    .add-worker-actions { display: flex; gap: var(--space-2); }
    .add-worker-actions .btn { flex: 1; }

    .settings-link {
      display: block;
      margin: var(--space-3) auto 0;
      background: transparent;
      border: none;
      color: var(--color-text-muted);
      font-size: 0.95rem;
      min-height: 48px;
      text-align: center;
      width: 100%;
    }

    /* ---------- Worker file ---------- */
    .field-row {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: 12px;
      padding: var(--space-3);
      margin-bottom: var(--space-2);
    }
    .field-label {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--color-text-muted);
      margin-bottom: 6px;
      display: block;
    }
    .rate-input-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .rate-prefix { font-size: var(--font-lg); font-weight: 600; color: var(--color-text); }

    .start-time-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-2);
    }
    .start-time-value { font-size: var(--font-lg); font-weight: 600; }

    .start-time-edit {
      margin-top: var(--space-2);
      display: flex;
      flex-direction: column;
      gap: var(--space-2);
    }
    .meridiem-toggle { display: flex; gap: var(--space-2); }
    .meridiem-btn {
      flex: 1;
      min-height: 48px;
      border-radius: 10px;
      border: 1px solid var(--color-border);
      background: var(--color-surface);
      color: var(--color-text);
      font-weight: 600;
    }
    .meridiem-btn.selected { background: var(--color-accent); border-color: var(--color-accent); color: #fff; }
    .start-time-actions { display: flex; gap: var(--space-2); }
    .start-time-actions .btn { flex: 1; }
    .field-hint { color: var(--color-danger); font-size: 0.9rem; margin-top: 6px; display: none; }
    .field-hint.show { display: block; }

    .history-row {
      display: block;
      width: 100%;
      text-align: left;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: 12px;
      padding: var(--space-3);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .history-row:active { background: #eef2f7; }
    .history-week { font-size: var(--font-body); font-weight: 600; }
    .history-hours { font-size: var(--font-body); color: var(--color-text-muted); }

    /* ---------- Utilities ---------- */
    .mt-3 { margin-top: var(--space-3); }

    /* ---------- Backup reminder banner (Task 7) ---------- */
    .backup-banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-2);
      background: var(--color-warn-bg);
      border: 1px solid var(--color-warn-border);
      color: var(--color-warn-text);
      border-radius: 12px;
      padding: var(--space-2) var(--space-3);
      margin-bottom: var(--space-3);
      font-size: 0.95rem;
    }
    .backup-banner-text { flex: 1; }
    .backup-banner-dismiss {
      min-width: 48px;
      min-height: 48px;
      border: none;
      background: transparent;
      color: var(--color-warn-text);
      font-size: 1.3rem;
      font-weight: 700;
      border-radius: 10px;
    }
    .backup-banner-dismiss:active { background: rgba(146, 64, 14, 0.15); }

    /* ---------- Attendance flags + hours chart (Task 8) ---------- */
    .flag-list { display: flex; flex-direction: column; }
    .flag-row {
      background: var(--color-warn-bg);
      border: 1px solid var(--color-warn-border);
      color: var(--color-warn-text);
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 8px;
      font-size: 0.95rem;
    }
    .flag-more {
      color: var(--color-text-muted);
      font-size: 0.85rem;
      text-align: center;
      padding: 2px 0 4px;
    }
    .attendance-ok {
      background: rgba(21, 128, 61, 0.1);
      border: 1px solid var(--color-confirm);
      color: var(--color-confirm);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 0.95rem;
    }

    .hours-chart-plot { margin-top: 4px; }
    .hours-chart-bars-row {
      position: relative;
      display: flex;
      align-items: flex-end;
      gap: 4px;
      height: 120px;
      padding: 0 4px;
      border-bottom: 1px solid var(--color-border);
    }
    .hours-chart-col-bar {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      height: 100%;
      min-width: 0;
    }
    .hours-chart-value {
      font-size: 0.7rem;
      color: var(--color-text-muted);
      margin-bottom: 2px;
      white-space: nowrap;
    }
    .hours-chart-bar { width: 70%; max-width: 26px; background: var(--color-accent); border-radius: 3px 3px 0 0; }
    .hours-chart-bar-zero { background: var(--color-border); }
    .hours-chart-40line { position: absolute; left: 0; right: 0; border-top: 1px dashed var(--color-chart-guide); pointer-events: none; }
    .hours-chart-40label {
      position: absolute;
      left: 2px;
      font-size: 0.65rem;
      color: var(--color-chart-guide);
      background: var(--color-surface);
      padding: 0 2px;
      line-height: 1;
    }
    .hours-chart-labels-row { display: flex; gap: 4px; padding: 0 4px; margin-top: 6px; }
    .hours-chart-col-label { flex: 1; min-width: 0; text-align: center; font-size: 0.7rem; color: var(--color-text-muted); }

    /* ---------- Week entry screen (Task 6) ---------- */
    .week-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-2);
      margin-bottom: var(--space-4);
    }
    .week-nav-btn {
      min-width: 48px;
      min-height: 48px;
      font-size: 1.5rem;
      font-weight: 700;
      border-radius: 12px;
      border: 1px solid var(--color-border);
      background: var(--color-surface);
      color: var(--color-accent);
    }
    .week-nav-btn:active { background: #e2e8f0; }
    .week-nav-label { flex: 1; text-align: center; }
    .week-worker-name { font-size: var(--font-lg); font-weight: 700; }
    .week-range { color: var(--color-text-muted); font-size: 0.95rem; margin-top: 2px; }

    .week-day-row {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: 12px;
      padding: var(--space-3);
      margin-bottom: var(--space-2);
    }
    .week-day-top {
      display: flex;
      align-items: center;
      gap: var(--space-2);
    }
    .week-day-label {
      font-weight: 700;
      min-width: 58px;
    }
    .week-day-times {
      display: flex;
      gap: var(--space-2);
      flex: 1;
    }
    .week-time-btn {
      flex: 1;
      min-height: 48px;
      font-size: 1rem;
    }
    .week-day-hours {
      min-width: 52px;
      text-align: right;
      font-weight: 700;
    }
    .week-day-note {
      color: var(--color-danger);
      font-size: 0.9rem;
      margin-top: 8px;
    }

    .lunch-chip {
      display: inline-flex;
      align-items: center;
      min-height: 48px;
      margin-top: 8px;
      padding: 0 16px;
      border-radius: 999px;
      font-size: 0.95rem;
      font-weight: 600;
    }
    .lunch-chip-on {
      border: 1.5px solid var(--color-accent);
      background: rgba(29, 78, 216, 0.08);
      color: var(--color-accent);
    }
    .lunch-chip-off {
      border: 1.5px solid var(--color-border);
      background: var(--color-surface);
      color: var(--color-text-muted);
    }

    .week-footer {
      margin-top: var(--space-4);
      text-align: center;
      padding: var(--space-3);
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: 12px;
    }
    .week-footer-label {
      font-size: 0.9rem;
      color: var(--color-text-muted);
      margin-bottom: 4px;
    }
    .week-footer-total {
      font-size: var(--font-lg);
      font-weight: 700;
    }

    /* ---------- Time entry keypad panel (Task 6) ---------- */
    .time-panel-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: var(--color-bg);
      display: flex;
      flex-direction: column;
      padding: var(--space-4) 20px;
      padding-top: calc(var(--space-4) + env(safe-area-inset-top));
      padding-bottom: calc(var(--space-4) + env(safe-area-inset-bottom));
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    .time-panel-title {
      font-size: var(--font-lg);
      font-weight: 700;
      text-align: center;
    }
    .time-panel-was {
      color: var(--color-text-muted);
      text-align: center;
      margin-top: 4px;
      font-size: 0.95rem;
    }
    .time-panel-preview {
      font-size: var(--font-xl);
      font-weight: 800;
      text-align: center;
      color: var(--color-accent);
      margin: var(--space-4) 0 var(--space-2);
      min-height: 1.3em;
    }
    .time-panel-preview.shake { animation: shake 0.5s; color: var(--color-danger); }
    .time-panel-digits {
      text-align: center;
      color: var(--color-text-muted);
      font-size: 1.1rem;
      min-height: 1.5em;
      margin-bottom: var(--space-3);
      letter-spacing: 0.05em;
    }
    .time-panel-keypad {
      margin: 0 auto var(--space-3);
    }
    .time-panel-meridiem {
      display: flex;
      gap: var(--space-2);
      max-width: 340px;
      width: 100%;
      margin: 0 auto var(--space-4);
    }
    .time-panel-actions {
      display: flex;
      flex-direction: column;
      gap: var(--space-2);
      max-width: 340px;
      width: 100%;
      margin: auto auto 0;
    }
    .time-panel-actions .btn { width: 100%; }

    /* ---------- Payday summary (Task 7) ---------- */
    .payday-row {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: 12px;
      padding: var(--space-3);
      margin-bottom: var(--space-2);
    }
    .payday-name { font-size: var(--font-lg); font-weight: 700; margin-bottom: 6px; }
    .payday-figure { font-size: 1.6rem; font-weight: 800; color: var(--color-accent); }
    .payday-est { margin-top: 6px; font-size: 0.9rem; color: var(--color-text-muted); }
    .payday-totals {
      margin-top: var(--space-4);
      text-align: center;
      padding: var(--space-3);
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: 12px;
      font-size: var(--font-lg);
      font-weight: 700;
    }

    /* ---------- Settings screen (Task 7) ---------- */
    .settings-file-label {
      display: block;
      width: 100%;
      text-align: center;
      box-sizing: border-box;
    }
    .settings-about {
      color: var(--color-text-muted);
      font-size: 0.9rem;
      text-align: center;
    }
  </style>
</head>
<body>
  <header id="topbar" class="topbar" hidden>
    <button type="button" id="backBtn" class="back-btn" hidden aria-label="Back">&#8249; Back</button>
    <h1 id="topbarTitle" class="topbar-title"></h1>
  </header>

  <main>
    <section id="screen-pin" class="screen">
      <div class="pin-screen">
        <h1 class="app-name">CE Timesheets</h1>
        <p id="pinMessage" class="pin-message" aria-live="polite">Enter PIN</p>
        <div id="pinDots" class="pin-dots" aria-hidden="true">
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>
        </div>
        <div id="pinKeypad" class="keypad">
          <button type="button" class="key" data-digit="1">1</button>
          <button type="button" class="key" data-digit="2">2</button>
          <button type="button" class="key" data-digit="3">3</button>
          <button type="button" class="key" data-digit="4">4</button>
          <button type="button" class="key" data-digit="5">5</button>
          <button type="button" class="key" data-digit="6">6</button>
          <button type="button" class="key" data-digit="7">7</button>
          <button type="button" class="key" data-digit="8">8</button>
          <button type="button" class="key" data-digit="9">9</button>
          <button type="button" class="key key-blank" tabindex="-1" aria-hidden="true" disabled></button>
          <button type="button" class="key" data-digit="0">0</button>
          <button type="button" class="key key-back" id="backspaceBtn" aria-label="Backspace">&#9003;</button>
        </div>
      </div>
    </section>

    <section id="screen-workers" class="screen" hidden>
      <div class="screen-content">
        <div id="backupBannerArea"></div>
        <div id="workersList"></div>
        <div id="addWorkerArea"></div>
        <button type="button" id="addWorkerBtn" class="btn btn-primary btn-block">+ Add worker</button>
        <button type="button" id="paydaySummaryBtn" class="btn btn-block mt-3">Payday summary</button>
        <button type="button" id="settingsBtn" class="settings-link">Settings</button>
      </div>
    </section>

    <section id="screen-worker" class="screen" hidden>
      <div class="screen-content">
        <div id="workerFields"></div>
        <button type="button" id="enterHoursBtn" class="btn btn-primary btn-block">Enter hours</button>
        <h3 class="section-heading">Week history</h3>
        <div id="workerHistory"></div>
        <!-- Task 8 fills this: late/missed flags + hours chart -->
        <div id="workerExtras"></div>
        <button type="button" id="deleteWorkerBtn" class="btn btn-danger btn-block mt-3">Delete worker</button>
      </div>
    </section>

    <section id="screen-week" class="screen" hidden>
      <div id="weekContent" class="screen-content"></div>
    </section>

    <section id="screen-payday" class="screen" hidden>
      <div id="paydayContent" class="screen-content"></div>
    </section>

    <section id="screen-settings" class="screen" hidden>
      <div class="screen-content">
        <h3 class="section-heading">Backup</h3>
        <button type="button" id="sendDataBtn" class="btn btn-primary btn-block">Send Data</button>

        <h3 class="section-heading">Import Data</h3>
        <label for="importFileInput" id="importDataLabel" class="btn btn-block settings-file-label">Import Data</label>
        <input type="file" id="importFileInput" accept="application/json,.json" hidden>

        <h3 class="section-heading">PIN</h3>
        <button type="button" id="changePinBtn" class="btn btn-block">Change PIN</button>

        <p id="aboutText" class="settings-about mt-3">CE Timesheets v1</p>
      </div>
    </section>
  </main>

  <script src="paymath.js"></script>
  <script src="storage.js"></script>
  <script src="app.js"></script>
</body>
